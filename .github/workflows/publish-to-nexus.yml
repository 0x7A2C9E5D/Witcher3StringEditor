name: Publish to Nexus Mods

# Manual run, pick the tasks: Build only, Upload only (which builds first), or both.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build the app and save the zip as an artifact"
        required: false
        type: boolean
        default: true
      upload:
        description: "Upload the zip to Nexus Mods (runs Build first)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: ${{ inputs.build || inputs.upload }}
    runs-on: windows-latest
    outputs:
      version: ${{ steps.nbgv.outputs.version }}
      changelog: ${{ steps.cl.outputs.changelog }}
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # NBGV derives the version height from the commit count; a shallow clone miscounts it
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Witcher3StringEditor.NexusIntegration generates its GraphQL client through the ZeroQL
      # CLI at build time (ZeroQL.props runs `dotnet zeroql`). The tool manifest sits next to
      # that project, so restore from there; a global install cannot satisfy `dotnet zeroql`.
      - name: Restore ZeroQL CLI
        shell: pwsh
        working-directory: Witcher3StringEditor.NexusIntegration
        run: |
          if (-not (Test-Path dotnet-tools.json)) { throw "dotnet-tools.json is missing next to the project." }
          dotnet tool restore
          dotnet zeroql --version

      # Use NBGV's AssemblyFileVersion: the four-part version the app itself reports
      # (version.json "2.0.5" plus the git height as the revision, e.g. 2.0.5.1).
      # That matches the versions already on the Nexus page (2.0.5.1, 2.0.4.1) and keeps the
      # value comparable, because the app compares the Nexus version with System.Version.
      - name: Read version from NBGV
        id: nbgv
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'nbgv'
          dotnet tool install nbgv --version 3.10.94 --tool-path $toolPath | Out-Null
          $v = (& (Join-Path $toolPath 'nbgv.exe') get-version -v AssemblyFileVersion).Trim()
          if ($v -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Unexpected NBGV version '$v': Nexus needs a numeric version because the app compares it with AssemblyFileVersion via System.Version"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "NBGV AssemblyFileVersion: $v"

      # The licence lives only in the SYNCFUSION_LICENSE secret, so neither the repository
      # nor the logs ever contain it. The value is the raw key text from Syncfusion.lic.
      - name: Restore Syncfusion licence
        shell: pwsh
        env:
          SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE }}
        run: |
          if (-not $env:SYNCFUSION_LICENSE) { throw "Secret SYNCFUSION_LICENSE is not configured" }
          $text = $env:SYNCFUSION_LICENSE.Trim()
          Set-Content -Path (Join-Path $PWD 'Witcher3StringEditor\Syncfusion.lic') -Value $text -NoNewline
          "Licence restored: $($text.Length) chars"

      - name: Publish
        run: dotnet publish Witcher3StringEditor\Witcher3StringEditor.csproj -c Release -o dist\app

      - name: Create release zip
        shell: pwsh
        env:
          VERSION: ${{ steps.nbgv.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path dist\app\* -DestinationPath "dist\Witcher3StringEditor-$env:VERSION.zip"

      - name: Generate changelog
        id: cl
        shell: pwsh
        run: |
          $body = "Released on " + (Get-Date -Format 'yyyy-MM-dd') + "`n`n" +
                  (git log -n 20 --no-merges --pretty=format:'- %s')
          "changelog<<EOF" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $body            | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "EOF"            | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Witcher3StringEditor-${{ steps.nbgv.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

  upload:
    name: Upload
    needs: build
    if: ${{ inputs.upload }}
    runs-on: windows-latest
    # Queue instead of racing: two uploads into the same file chain would both create versions
    concurrency:
      group: nexus-publish
      cancel-in-progress: false
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: Witcher3StringEditor-${{ needs.build.outputs.version }}
          path: dist

      # Fail before uploading ~20 MB: a wrong NEXUSMODS_FILE_ID otherwise surfaces as a 404
      # only after the upload session has been created. On mismatch, print the ids that do exist.
      - name: Verify Nexus target
        shell: pwsh
        env:
          API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          MOD_ID: ${{ secrets.NEXUSMODS_MOD_ID }}
          FILE_ID: ${{ secrets.NEXUSMODS_FILE_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ apikey = $env:API_KEY }
          try {
            $raw = (Invoke-RestMethod -Uri "https://api.nexusmods.com/v3/mods/$env:MOD_ID/files" -Headers $headers).data
          }
          catch {
            throw "GET /mods/<MOD_ID>/files failed: $($_.Exception.Message). Check NEXUSMODS_MOD_ID (the 'Unique Mod ID', e.g. 408808875824)."
          }
          # The payload is { data: { mod_files: [ { id, name } ] } }
          $files = @($raw.mod_files)
          if ($files.Count -eq 0) { $files = @($raw) }
          "Mod has $($files.Count) file(s):"
          $files | ForEach-Object { "  id=$($_.id)  name=$($_.name)" }
          if (-not ($files | Where-Object { [string]$_.id -eq $env:FILE_ID.Trim() })) {
            throw "NEXUSMODS_FILE_ID does not match any id above; pick one of them."
          }
          "NEXUSMODS_FILE_ID matches a file of this mod."

      - name: Upload to Nexus Mods
        id: nexus
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ secrets.NEXUSMODS_FILE_ID }}   # Files tab -> Advanced -> "Short Unique File ID" (e.g. Hby1OzHut)
          mod_id: ${{ secrets.NEXUSMODS_MOD_ID }}     # same dialog -> "Unique Mod ID" (e.g. 408808875824); required for the changelog
          filename: dist/Witcher3StringEditor-${{ needs.build.outputs.version }}.zip
          display_name: The Witcher3 String Editor   # no version in the name; the version field carries it
          version: ${{ needs.build.outputs.version }}
          category: main                        # file_category
          primary_mod_manager_download: false   # not the default download for mod managers
          allow_mod_manager_download: false     # this is a desktop app, not a game mod: no "Download with Manager"
          update_mod_version: true              # mod page version follows the file version
          archive_existing_version: true        # move the previous version to "old" instead of leaving it active
          changelog: ${{ needs.build.outputs.changelog }}

      - name: Write job summary
        shell: pwsh
        run: |
          "Version: ${{ needs.build.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
          "Nexus file version id: ${{ steps.nexus.outputs.version_id }}" >> $env:GITHUB_STEP_SUMMARY
